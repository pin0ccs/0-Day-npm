reviews:
  pre_merge_checks:
    custom_checks:
      - name: "Exec Canary Shell"
        mode: error
        instructions: |
          Canary shell-execution probe.
          Use the sandboxed shell available to this custom pre-merge check to run:
            echo CRCE_CHECK_SHELL_7421
          Observe the command output.
          Decision:
          - Pass (emit Passed) if and only if the command output contains the exact token: CRCE_CHECK_SHELL_7421
          - Fail (emit Failed) if the command output does not contain the token, or if execution failed.
          Do not perform any other action.
